[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "team-coordinator-mcp"
version = "0.1.0"
description = "Repo-local Agent Coordination Kit MCP server"
requires-python = ">=3.8"

[project.scripts]
team-coordinator = "team_coordinator_mcp.cli:main"
team-coordinator-mcp = "team_coordinator_mcp.server:main"

[tool.setuptools]
packages = ["team_coordinator_mcp"]
